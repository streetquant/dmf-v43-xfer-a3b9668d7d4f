name: Fetch retention reference data

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fetch-retention-reference-data.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch holiday and currency reference data
        run: |
          mkdir -p reference_data
          curl -L --fail --retry 5 --retry-all-errors 'https://nagerholidays.com/api/v4/Holidays/GB/2026' -o reference_data/gb_public_holidays_2026.json
          curl -L --fail --retry 5 --retry-all-errors 'https://api.frankfurter.dev/v2/rate/EUR/GBP' -o reference_data/eur_gbp_rate.json
          python - <<'PY'
          import json
          h=json.load(open('reference_data/gb_public_holidays_2026.json'))
          r=json.load(open('reference_data/eur_gbp_rate.json'))
          assert isinstance(h,list) and len(h)>5
          assert isinstance(r,dict) and 'rate' in r
          print('holidays',len(h),'rate',r)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: retention-reference-data
          path: reference_data/
          retention-days: 1
